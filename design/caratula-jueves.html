<html>
<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; box-sizing: border-box; }
body {
  width: 1280px; height: 720px; overflow: hidden;
  background: #0D1420;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 43px, rgba(255,255,255,.03) 43px, rgba(255,255,255,.03) 44px);
  font-family: "Space Grotesk", sans-serif; color: #E8EDF5;
  display: flex; align-items: center; gap: 64px;
  padding: 0 80px;
}
h1 {
  font-size: 76px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.03;
  flex: 1;
}
h1 .verde { color: #3DD68C; }
.foto {
  width: 340px; height: 340px; border-radius: 50%; overflow: hidden;
  flex: none; border: 3px solid rgba(232,237,245,.18);
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <h1>No solo uso la IA.<br><span class="verde">Construyo</span> con ella.</h1>

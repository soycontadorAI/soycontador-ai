<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="lienzo" content="1280x720">
<meta name="salida" content="public/assets/empieza-video.jpg">
<title>caratula-empieza</title>
<style>
/* ============================================================
   Carátula del video de /empieza (1280x720, JPG de menos de 100 KB).
   `node design/piezas/render.mjs caratula-empieza`.

   En YouTube el video lleva su miniatura de CTR (caja alta, flechas, cara de
   sorpresa). En el sitio esa imagen desentona, así que la fachada usa esta:
   el mismo gesto que el OG de la home (la objeción en cursiva gris y la
   vuelta en redonda con el plumón), con las palabras del gancho del video.

   Se ve a un tercio de su tamaño (la tarjeta de "Con qué sales" mide unos
   420px), así que el texto va grande y es poco. Las dos esquinas de abajo
   las tapa la fachada (la cinta a la izquierda, el botón de play a la
   derecha): el texto termina antes de los 440px de alto, porque en celular la
   cinta crece en proporción y llega hasta ahí.
   ============================================================ */
@font-face {
  font-family: "Instrument Serif";
  font-style: normal; font-weight: 400; font-display: block;
  src: url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Instrument Serif";
  font-style: italic; font-weight: 400; font-display: block;
  src: url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2") format("woff2");
}
:root {
  --bg: #FBFAF7;
  --ink: #14161A;
  --ink-dim: #666B75;
  --marker: #3DD68C;
  --line: #E3E0D8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  position: relative;
  width: 1280px; height: 720px; overflow: hidden;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.texto {
  position: absolute;
  left: 76px; top: 84px;
  z-index: 1;
}
/* La voz ajena: el gancho del video, en cursiva y gris */
.objecion {
  font-family: "Instrument Serif", serif; font-weight: 400; font-style: italic;
  font-size: 76px; line-height: 1.08; letter-spacing: -0.01em;
  color: var(--ink-dim);
  white-space: nowrap;
}
/* La vuelta: redonda, tinta plena y el plumón calibrado como en el sitio
   (0.22em abajo, o sobre la serif se lee como tachado). */
.giro {
  font-family: "Instrument Serif", serif; font-weight: 400;
  font-size: 118px; line-height: 1.02; letter-spacing: -0.02em;
  margin-top: 30px;
  white-space: nowrap;
}
.giro b {
  font-weight: 400;
  background-image: linear-gradient(
    to top,
    transparent 0.22em,
    var(--marker) 0.22em,
    var(--marker) 0.72em,
    transparent 0.72em
  );
  background-repeat: no-repeat;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
/* Recorte apoyado en el canto de abajo: el borde de la imagen es el suelo. */
.retrato {
  position: absolute;
  right: 36px;
  bottom: 0;
  height: 660px;
  width: auto;
  display: block;
}
</style>
</head>
<body>
  <div class="texto">
    <p class="objecion">“¿Te contestó como blog?”</p>
    <p class="giro"><b>No fue la</b><br><b>herramienta.</b></p>
  </div>
  <img class="retrato" src="../../public/assets/israel-saco-brazos.webp" alt="">
</body>
</html>
